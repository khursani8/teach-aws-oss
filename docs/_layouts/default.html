<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#28313f;
  --txt:#d8dee9; --dim:#8b95a7; --acc:#6cb6ff; --good:#5ce08a; --warn:#f0c24b; --purple:#c792ea;
  --maxw:880px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font:16px/1.75 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--txt);
  background-image:radial-gradient(900px 400px at 75% -8%, #16213a40, transparent);
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px 96px}

/* header */
header.site{
  border-bottom:1px solid var(--line);
  background:rgba(13,17,23,.85); backdrop-filter:blur(8px);
  position:sticky; top:0; z-index:10;
}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{color:var(--txt);font-size:15px;letter-spacing:.2px}
.brand span{color:var(--dim);font-size:12.5px}
nav.chapters{display:flex;gap:2px;flex-wrap:wrap}
nav.chapters a{
  color:var(--dim);text-decoration:none;font-size:13px;padding:6px 11px;border-radius:8px;
}
nav.chapters a:hover{color:var(--txt);background:var(--panel2)}
nav.chapters a.on{color:var(--acc);background:#6cb6ff18}

/* typography */
h1{font-size:31px;line-height:1.25;margin:56px 0 8px;font-weight:700;letter-spacing:-.3px}
h2{font-size:21px;margin:44px 0 12px;color:var(--txt);font-weight:650}
h3{font-size:16.5px;margin:28px 0 8px;color:var(--acc);font-weight:600}
p{margin:14px 0}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.subtitle{color:var(--dim);font-size:15px;margin-bottom:8px}

/* tables */
table{border-collapse:collapse;width:100%;margin:20px 0;font-size:14.5px;display:block;overflow-x:auto}
th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;text-align:left;font-weight:600}
th,td{padding:9px 14px;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:#ffffff06}
td strong{color:var(--good)}

/* code + quotes */
code{font:13px/1.5 'SFMono-Regular',Consolas,'Liberation Mono',monospace;background:#1f2937;color:#a5d6ff;padding:2px 6px;border-radius:5px}
pre{background:#0a0e14;border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto;margin:18px 0}
pre code{background:none;padding:0;color:#c9d6e5}
blockquote{
  border-left:3px solid var(--acc);background:var(--panel);border-radius:0 10px 10px 0;
  padding:14px 20px;margin:18px 0;color:var(--txt)
}
blockquote p{margin:6px 0}

/* lists */
ul,ol{padding-left:26px;margin:14px 0}
li{margin:6px 0}
hr{border:none;border-top:1px solid var(--line);margin:40px 0}

/* chapter footer nav */
.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin-top:64px;
  border-top:1px solid var(--line);padding-top:20px}
.chapter-nav a{color:var(--dim);font-size:13.5px}
.chapter-nav a:hover{color:var(--acc)}

/* gallery */
.svc-picker{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 6px}
.svc-picker a{font-size:13px;color:var(--acc);background:var(--panel2);padding:7px 14px;border-radius:20px;border:1px solid var(--line)}
.svc-picker a:hover{text-decoration:none;background:#6cb6ff22}
section.svc{margin-top:54px;scroll-margin-top:84px}
.svc h2{display:inline-block;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--acc);
  background:#6cb6ff14;border:1px solid #6cb6ff33;padding:5px 14px;border-radius:8px;margin:0 0 8px}
.q{font-size:17.5px;font-weight:600;color:var(--txt);margin:14px 0 10px}
details.ref{margin:0 0 18px;color:var(--dim);font-size:14px}
details.ref summary{cursor:pointer;font-size:12.5px;text-transform:uppercase;letter-spacing:.7px}
details.ref p{color:var(--dim);border-left:2px solid var(--line);padding-left:14px}
.answer{border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:10px 0;background:var(--panel)}
.answer.good{border-color:#5ce08a55;background:linear-gradient(160deg,#12241a55,var(--panel))}
.a-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.a-head b{font-size:14.5px}
.a-head span{font-size:11.5px;color:var(--dim)}
.answer p{margin:0;font-size:15px;line-height:1.7}

/* misc */
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:12px;background:#123b22;color:var(--good);vertical-align:2px}
@media(max-width:640px){h1{font-size:25px} table{font-size:13px}}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <b>teach-aws</b><span>experiment walkthrough</span>
    </a>
    <nav class="chapters">
      <a href="{{ '/gallery.html' | relative_url }}" {% if page.title contains 'service' %}class="on"{% endif %}>Examples</a>
      <a href="{{ '/setup.html' | relative_url }}" {% if page.title contains 'Setup' %}class="on"{% endif %}>1 Setup</a>
      <a href="{{ '/sweep.html' | relative_url }}" {% if page.title contains 'sweep' %}class="on"{% endif %}>2 Sweep</a>
      <a href="{{ '/data.html' | relative_url }}" {% if page.title contains 'Data' %}class="on"{% endif %}>3 Data</a>
      <a href="{{ '/frontier.html' | relative_url }}" {% if page.title contains 'frontier' %}class="on"{% endif %}>4 Frontier</a>
      <a href="{{ '/failures.html' | relative_url }}" {% if page.title contains 'Failures' %}class="on"{% endif %}>5 Failures</a>
      <a href="{{ '/shipped.html' | relative_url }}" {% if page.title contains 'shipped' %}class="on"{% endif %}>6 Shipped</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
<div class="chapter-nav">
  {% if page.prev %}<a href="{{ page.prev }}.html">← previous</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a href="{{ page.next }}.html">next →</a>{% else %}<span></span>{% endif %}
</div>
</main>
</body>
</html>
